buildscript {
  ext.SimpleImageCompressor = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return SimpleImageCompressor[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/simpleimagecompressor+autolinking.gradle'

apply plugin: "com.facebook.react"
apply plugin: "jacoco"


jacoco {
  toolVersion = "0.8.15"
}

android {
  namespace "com.margelo.nitro.simpleimagecompressor"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    consumerProguardFiles 'proguard-rules.pro'

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        jacoco {
          includeNoLocationClasses = true
          excludes = ["jdk.internal.*"]
        }

        testLogging {
          events "passed", "skipped", "failed"
          exceptionFormat "full"
        }
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.11.1'
  testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

// Coverage
tasks.register('jacocoTestReport', JacocoReport) {
  dependsOn "testDebugUnitTest"

  group = "Reporting"
  description = "Generate Jacoco coverage reports for the debug build."

  reports {
    xml.required = true
    html.required = true
  }

  def fileFilter = [
    '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
    '**/*Test*.*', 'android/**/*.*',
    '**/nitrogen/**/*.*',
    // exclude nitrogen + data classes
    '**/Hybrid*Spec*.*',
    '**/*OnLoad*.*',
    '**/CompressOptions*.*',
    '**/CompressedResult*.*',
    '**/OutputCompressedFormat*.*',
    // exclude boilerplate RN
    '**/*Package*.*'
  ]

  def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
  def kotlinDebugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)

  def mainSrc = "${project.projectDir}/src/main/java"
  def kotlinSrc = "${project.projectDir}/src/main/kotlin"

  sourceDirectories.setFrom(files([mainSrc, kotlinSrc]))
  classDirectories.setFrom(files([debugTree, kotlinDebugTree]))

  executionData.setFrom(fileTree(dir: "$buildDir", includes: [
    "jacoco/testDebugUnitTest.exec",
    "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
  ]))
}
